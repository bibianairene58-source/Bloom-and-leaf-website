<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Bloom & Leaf</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h2 class="logo">Bloom & Leaf</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <section class="page-heading">
      <h1>Contact Us</h1>
      <p>We would love to hear from you.</p>
    </section>

    <section class="contact-section">
      <div class="contact-info">
        <h2>Get in Touch</h2>
        <p>Email: hello@bloomandleaf.com</p>
        <p>Location: Ibadan, Nigeria</p>
        <p>Opening Hours: Monday - Saturday, 9am - 5pm</p>
      </div>

      <form>
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Enter your name" required />

        <label for="email">Your Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />

        <label for="message">Your Message</label>
        <textarea
          id="message"
          rows="5"
          placeholder="Write your message"
          required
        ></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>

    <footer>
      <p>&copy; 2026 Bloom & Leaf. All rights reserved.</p>
    </footer>
  </body>
</html>
